service: serverless-users-service
frameworkVersion: "4"

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

# Configuración ESBuild para TypeScript
build:
  esbuild:
    bundle: true # Hace bundle de dependencias
    minify: false # Desactivado en desarrollo
    sourcemap: true # Source maps para debugging
    target: node20 # Usa Node.js 20
    platform: node
    # concurrency: 10 # Compilación paralela más rápida NO FUNCIONA
    # keepOutputDirectory: true # Mantiene directorio de salida NO FUNCIONA
    # Configurar exclusiones automáticas
    exclude:
      - "@aws-sdk/*" # AWS SDK ya está en Lambda runtime
      - "aws-lambda" # Ya disponible en Lambda
    # Configurar alias si usas paths en tsconfig
    # alias:
    #   "@src/*": "./src/*"

# Configurar cómo se empaca cada función
package:
  individually: true # Cada función se empaca por separado
  patterns:
    - "!**/*.test.ts"
    - "!**/*.spec.ts"
    - "!README.md"
    - "!TODO.md"
    - "!DONE.md"
    - "!.git/**" # Excluir git
    - "!node_modules/.cache/**" # Excluir cache

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  stage: ${opt:stage, 'dev'}
  region: us-east-1

  logRetentionInDays: 7

  httpApi:
    cors:
      allowedOrigins:
        - "*"
      allowedHeaders:
        - "*"
      allowedMethods:
        - "*"
      allowCredentials: false

  environment:
    NODE_ENV: ${env:STAGE, 'dev'}
    NODE_OPTIONS: --enable-source-maps
    USERS_TABLE: ${env:USERS_TABLE, 'users-service-db'}
    REGION: ${env:REGION, 'us-east-1'}
    # Variables específicas por stage
    STAGE: ${sls:stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${env:REGION, self:provider.region}:${env:AWS_ACCOUNT_ID, '000000000000'}:table/${self:custom.usersTableName}
            - arn:aws:dynamodb:${env:REGION, self:provider.region}:${env:AWS_ACCOUNT_ID, '000000000000'}:table/${self:custom.usersTableName}/index/*

custom:
  dotenv:
    path: .env.${sls:stage}
  usersTableName: ${env:USERS_TABLE, 'users-service-db'}

# Por ahora lo dejamos vacío: vas a ir agregando handlers poco a poco.
functions:
  healthCheck:
    handler: src/functions/health/health-check.handler
    events:
      - httpApi:
          method: GET
          path: /health
  createUser:
    handler: src/functions/users/create.handler
    events:
      - httpApi:
          method: POST
          path: /users
  getUserById:
    handler: src/functions/users/get-by-id.handler
    events:
      - httpApi:
          method: GET
          path: /users/{id}
  getUserByEmail:
    handler: src/functions/users/get-by-email.handler
    events:
      - httpApi:
          method: GET
          path: /users/by-email
  listUsers:
    handler: src/functions/users/list.handler
    events:
      - httpApi:
          method: GET
          path: /users
  updateUser:
    handler: src/functions/users/update.handler
    events:
      - httpApi:
          method: PUT
          path: /users/{id}

